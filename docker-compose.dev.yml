services:
  sveltekit:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-supersecretplaceholder}
        DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/sample_manager}
      target: builder
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '3000:5173' # vite dev server port
    command: pnpm dev --host
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:local.db}
      ORIGIN: http://localhost:5173

  fastapi:
    build:
      context: ./fast-api
      dockerfile: Dockerfile
    volumes:
      - ./fast-api:/app # live reload your python changes
      - uploads:/app/uploads
    ports:
      - '8000:8000'
    environment:
      UPLOAD_DIR: /app/uploads
    command: uvicorn fastapi_server.main:app --host 0.0.0.0 --reload
