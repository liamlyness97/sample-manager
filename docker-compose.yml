services:
  sveltekit:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-supersecretplaceholder}
        DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/sample_manager}
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:local.db}
      ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  fastapi:
    build:
      context: ./fast-api
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-sample_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads:
